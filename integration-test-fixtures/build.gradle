plugins {
    id "java-library"
    id "io.github.qishr.cascara.conventions" version "0.1.0"
}

repositories {
	mavenLocal()
	mavenCentral()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

dependencies {
    implementation(platform("io.github.qishr:cascara-meta-bom:$cascara_version"))
    implementation("org.junit.jupiter:junit-jupiter-api")
    implementation("org.junit.jupiter:junit-jupiter-engine")
    implementation('org.junit.platform:junit-platform-launcher')
    implementation('io.github.qishr:cascara-common')
    implementation('io.github.qishr:cascara-lang-json')
    implementation('io.github.qishr:cascara-test-common-junit')
    implementation(project(':cascara-common-io'))
    // implementation('io.github.qishr:cascara-common-io')
}


tasks.named('javadocJar') {
    enabled = false
}

tasks.named('sourcesJar') {
    enabled = false
}


tasks.withType(Javadoc).configureEach {
    options.addStringOption('Xdoclint:-missing', '-quiet')
}

compileTestJava {
    // Ensures main classes are always compiled and available on the patch path
    dependsOn compileJava
    options.compilerArgs += [
        '--patch-module', "integration.test=${sourceSets.main.output.classesDirs.asPath}"
    ]
}

// tasks.named('test', Test) {
//     jvmArgs += [
//         '--patch-module', "integration.test=${sourceSets.main.output.classesDirs.asPath}"
//     ]
// }

test {
    modularity.inferModulePath = true

    // Capture source set output paths lazily during configuration time
    def mainClassesDir = sourceSets.main.output.classesDirs
    def testClassesDir = sourceSets.test.output.classesDirs
    def runtimeClasspath = configurations.testRuntimeClasspath

    doFirst {
        def mainModuleName = 'integration.test'

        jvmArgs([
            '--module-path', "${testClassesDir.asPath}${File.pathSeparator}${runtimeClasspath.asPath}",
            '--add-modules', mainModuleName,
            '--patch-module', "${mainModuleName}=${mainClassesDir.asPath}",
            '--add-reads', "${mainModuleName}=ALL-UNNAMED",
            '--add-reads', "${mainModuleName}=org.junit.jupiter.api",
            '--add-reads', "${mainModuleName}=org.junit.platform.commons",
            '--add-opens', "${mainModuleName}/integration.test.isolated=org.junit.platform.commons",
            '--add-opens', "${mainModuleName}/integration.test.isolated=org.junit.jupiter.api",
        ])
    }

    // doFirst {
