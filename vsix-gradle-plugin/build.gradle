plugins {
    id 'java'
    id 'java-gradle-plugin'
    id("com.gradle.plugin-publish") version "1.2.1"
}

group = 'io.qishr.github'
version = '0.1.0'


tasks.withType(JavaCompile).configureEach {
    options.release = 21
}


repositories {
	mavenLocal()
    mavenCentral()
}

dependencies {
    implementation(platform("io.github.qishr:cascara-meta-bom:0.1.21"))
    implementation "io.github.qishr:cascara-common"
    implementation "io.github.qishr:cascara-common-io"

    implementation(project(":vsix-format"))
}

gradlePlugin {
    website = "https://github.com/qishr/cascara-gradle-vsix"
    vcsUrl = "https://github.com/qishr/cascara-gradle-vsix"
    plugins {
        javaLibraryConventions {
            id = "io.github.qishr.cascara-gradle-plugins.vsix"
            implementationClass = "io.github.qishr.cascara.gradle.vsix.VsixPlugin"
            displayName = "Cascara VSIX Gradle DSL"
            description = "Color VSIX Gradle DSL"
            tags = ["java-setup", "api-configuration", "test-setup", "jar-manifest", "toolchain-configuration"]
        }
    }
}

